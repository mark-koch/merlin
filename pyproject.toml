[project]
name = "merlin-sim"
version = "0.1.0"
description = "Polynomial-time simulator for non-Clifford quantum error correction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.1"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[dependency-groups]
experiments = [
    "scipy>=1.14",
    "matplotlib>=3.10",
    "clifft==0.9.0; python_version >= '3.12'"
]
dev = [
    "maturin>=1.9,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.30",
    "pytest>=8.4",
]
benchmark = [
    "bloqade-tsim==0.1.5",
    "clifft==0.9.0; python_version >= '3.12'",
    "matplotlib>=3.10",
    "symft",
    "xtim; python_version >= '3.11'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "external: uses optional simulator installations",
    "slow: deliberately expensive full benchmark circuits",
]

[tool.maturin]
module-name = "merlin._core"
python-source = "python"
features = ["python"]

[tool.uv.sources]
symft = { path = "benchmarks/symft/python" }
xtim = { git = "https://github.com/ikim-quantum/xtim", rev = "89c550f" }

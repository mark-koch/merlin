[package]
name = "merlin"
version = "0.1.0"
edition = "2024"
description = "Polynomial-time simulator for CNOT+T DCP-stabilizer states"
readme = "README.md"

[lib]
name = "merlin"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:numpy", "dep:pyo3"]

[dependencies]
num-complex = "0.4"
numpy = { version = "0.29", optional = true }
pest = "2.8"
pest_derive = "2.8"
pyo3 = { version = "0.29", features = ["abi3-py310"], optional = true }
rand = "0.9"
rand_chacha = "0.9"

[profile.release]
debug = true
